<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signal & Noise — Herff Jones Order Entry Flow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07090e;
      --text-bright: #ffffff;
      --text-main: #e2e8f0;
      --text-dim: #94a3b8;
      --border-line: #1e293b;
      --border-accent: #334155;

      /* High-Contrast Telemetry Accents */
      --color-order: #38bdf8;
      --color-cs: #fbbf24;
      --color-oracle: #f87171;
      --color-reentry: #eab308;
      --color-teams: #60a5fa;
      --color-reject: #ef4444;
      --color-action: #34d399;

      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-mono: 'JetBrains Mono', ui-monospace, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100%;
      height: 100%;
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font-mono);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      user-select: none;
    }

    /* Top Telemetry Header */
    header {
      padding: 1.25rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-line);
      z-index: 10;
    }
    .brand-group {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }
    .site-title {
      font-family: var(--font-serif);
      font-size: 1.75rem;
      font-weight: 400;
      color: var(--text-bright);
      letter-spacing: -0.01em;
    }
    .site-subtitle {
      font-size: 0.72rem;
      color: var(--text-dim);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-weight: 600;
    }
    .share-btn {
      background: transparent;
      border: 1px solid var(--border-accent);
      color: var(--text-bright);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      padding: 0.35rem 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s;
    }
    .share-btn:hover {
      border-color: var(--color-cs);
      color: var(--color-cs);
    }

    /* Top Legend Bar */
    .legend-bar {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 600;
    }
    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text-main);
    }
    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .legend-dash {
      width: 14px;
      height: 2px;
      border-top: 2px dashed;
    }

    /* Fullscreen Interactive Canvas */
    .canvas-viewport {
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Bottom Status Telemetry Footer */
    footer {
      border-top: 1px solid var(--border-line);
      display: grid;
      grid-template-columns: repeat(5, 1fr) auto;
      background: rgba(7, 9, 14, 0.95);
      z-index: 10;
    }
    .metric-cell {
      padding: 1rem 1.5rem;
      border-right: 1px solid var(--border-line);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .metric-val {
      font-family: var(--font-serif);
      font-size: 2.2rem;
      font-weight: 400;
      font-style: italic;
      color: var(--text-bright);
      line-height: 1;
      margin-bottom: 0.35rem;
    }
    .metric-lbl {
      font-size: 0.68rem;
      color: var(--text-dim);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 600;
    }
    .footer-actions {
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 600;
    }
    .footer-actions a {
      color: var(--text-bright);
      text-decoration: none;
      transition: color 0.2s;
    }
    .footer-actions a:hover {
      color: var(--color-cs);
    }
  </style>
</head>
<body>

  <!-- Header & Legend -->
  <header>
    <div class="brand-group">
      <h1 class="site-title">Signal &amp; Noise</h1>
      <div class="site-subtitle">Herff Jones &middot; Order Entry Flow &middot; Realtime Routing</div>
    </div>

    <div class="legend-bar">
      <div class="legend-item">
        <span class="legend-dot" style="background: var(--color-order);"></span>
        <span>Order Moving</span>
      </div>
      <div class="legend-item">
        <span class="legend-dot" style="background: var(--color-cs);"></span>
        <span>CS Hold</span>
      </div>
      <div class="legend-item">
        <span class="legend-dot" style="background: var(--color-oracle);"></span>
        <span>Oracle / Error</span>
      </div>
      <div class="legend-item">
        <span class="legend-dot" style="background: var(--color-reentry);"></span>
        <span>WC&harr;Oracle Re-entry</span>
      </div>
      <div class="legend-item">
        <span class="legend-dash" style="color: var(--color-teams);"></span>
        <span>Teams / In-Person</span>
      </div>
      <div class="legend-item">
        <span class="legend-dash" style="color: var(--color-reject);"></span>
        <span>Formal Reject</span>
      </div>
    </div>

    <button class="share-btn" onclick="navigator.clipboard.writeText(window.location.href); alert('Link copied to clipboard');">Share &uarr;</button>
  </header>

  <!-- Interactive Network Simulation -->
  <main class="canvas-viewport">
    <canvas id="flowCanvas"></canvas>
  </main>

  <!-- Bottom Diagnostic Telemetry -->
  <footer>
    <div class="metric-cell">
      <div class="metric-val" id="valInTransit">3</div>
      <div class="metric-lbl">In Transit</div>
    </div>
    <div class="metric-cell">
      <div class="metric-val" id="valReentry">131</div>
      <div class="metric-lbl">WC&harr;Oracle Trips</div>
    </div>
    <div class="metric-cell">
      <div class="metric-val" id="valCsHold">13</div>
      <div class="metric-lbl">CS Hold</div>
    </div>
    <div class="metric-cell">
      <div class="metric-val" id="valOracleError">11</div>
      <div class="metric-lbl">Oracle Error</div>
    </div>
    <div class="metric-cell">
      <div class="metric-val" id="valToProd">0</div>
      <div class="metric-lbl">To Production</div>
    </div>
    <div class="footer-actions">
      <a href="../index.html">&larr; Cabinet</a>
      <span style="color: var(--border-accent);">&middot;</span>
      <a href="#" onclick="location.reload(); return false;">Reset</a>
    </div>
  </footer>

  <script>
    const canvas = document.getElementById('flowCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    function resize() {
      width = canvas.width = canvas.parentElement.clientWidth;
      height = canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // System Nodes Layout
    function getNodes() {
      const cy = height * 0.44;
      return {
        wcQueue:    { x: width * 0.06, y: cy, r: 28, label: 'WebCenter Queue', color: '#38bdf8' },
        orderEntry: { x: width * 0.32, y: cy, r: 44, label: 'Order Entry', color: '#f87171' },
        csHold:     { x: width * 0.32, y: cy + (height * 0.34), r: 38, label: 'CS Hold', sub: 'Oracle-Zendesk-Wrike-Teams', color: '#fbbf24' },
        namelist:   { x: width * 0.62, y: cy, r: 32, label: 'Namelist', color: '#eab308' },
        prepress:   { x: width * 0.82, y: cy, r: 26, label: 'Prepress', color: '#34d399' },
        production: { x: width * 0.94, y: cy, r: 24, label: 'Production', color: '#34d399' }
      };
    }

    // Packet System
    let packets = [];
    const packetTypes = ['order', 'reentry', 'oracle', 'cs'];

    function spawnPacket() {
      const type = packetTypes[Math.floor(Math.random() * packetTypes.length)];
      packets.push({
        type: type,
        progress: 0,
        speed: 0.0018 + Math.random() * 0.0015,
        loopCount: 0
      });
    }

    for (let i = 0; i < 18; i++) {
      packets.push({
        type: packetTypes[Math.floor(Math.random() * packetTypes.length)],
        progress: Math.random(),
        speed: 0.0018 + Math.random() * 0.0015,
        loopCount: 0
      });
    }
    setInterval(spawnPacket, 1200);

    let tick = 0;

    function drawDashedCurve(p1, p2, cp1, cp2, color) {
      ctx.save();
      ctx.setLineDash([4, 6]);
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.bezierCurveTo(cp1.x, cp1.y, cp2.x, cp2.y, p2.x, p2.y);
      ctx.stroke();
      ctx.restore();
    }

    function getBezierPoint(t, p0, p1, p2, p3) {
      const cx = 3 * (p1.x - p0.x);
      const bx = 3 * (p2.x - p1.x) - cx;
      const ax = p3.x - p0.x - cx - bx;

      const cy = 3 * (p1.y - p0.y);
      const by = 3 * (p2.y - p1.y) - cy;
      const ay = p3.y - p0.y - cy - by;

      const tSquared = t * t;
      const tCubed = tSquared * t;

      return {
        x: (ax * tCubed) + (bx * tSquared) + (cx * t) + p0.x,
        y: (ay * tCubed) + (by * tSquared) + (cy * t) + p0.y
      };
    }

    function animate() {
      ctx.clearRect(0, 0, width, height);
      tick += 0.02;
      const N = getNodes();

      // --- 1. Static Pipeline Grid & Curves ---
      // Main Spine
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(N.wcQueue.x, N.wcQueue.y);
      ctx.lineTo(N.production.x, N.production.y);
      ctx.stroke();

      // Teams / In-Person Backchannel (OE <-> CS Hold Left Loop)
      drawDashedCurve(
        N.orderEntry, N.csHold,
        { x: N.orderEntry.x - 45, y: (N.orderEntry.y + N.csHold.y) / 2 },
        { x: N.csHold.x - 45, y: (N.orderEntry.y + N.csHold.y) / 2 },
        '#60a5fa'
      );

      // Formal Rejection Loop (OE <-> CS Hold Right Loop)
      drawDashedCurve(
        N.csHold, N.orderEntry,
        { x: N.csHold.x + 35, y: (N.orderEntry.y + N.csHold.y) / 2 },
        { x: N.orderEntry.x + 35, y: (N.orderEntry.y + N.csHold.y) / 2 },
        '#ef4444'
      );

      // Re-entry Arc (Namelist -> Order Entry)
      drawDashedCurve(
        N.namelist, N.orderEntry,
        { x: (N.namelist.x + N.orderEntry.x) / 2, y: N.orderEntry.y - 80 },
        { x: (N.namelist.x + N.orderEntry.x) / 2, y: N.orderEntry.y - 80 },
        '#334155'
      );

      // Prepress Re-entry Arc (Prepress -> Order Entry)
      drawDashedCurve(
        N.prepress, N.orderEntry,
        { x: (N.prepress.x + N.orderEntry.x) / 2, y: N.orderEntry.y - 120 },
        { x: (N.prepress.x + N.orderEntry.x) / 2, y: N.orderEntry.y - 120 },
        '#242933'
      );

      // --- 2. Render System Nodes ---
      Object.values(N).forEach(node => {
        // Outer Translucent Zone
        ctx.fillStyle = node.color + '10';
        ctx.strokeStyle = node.color + '40';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(node.x, node.y, node.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Inner Core Ring
        ctx.fillStyle = '#07090e';
        ctx.strokeStyle = node.color;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(node.x, node.y, node.r * 0.45, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Labels
        ctx.font = '600 13px "JetBrains Mono", monospace';
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.fillText(node.label, node.x, node.y + node.r + 20);

        if (node.sub) {
          ctx.font = '500 10px "JetBrains Mono", monospace';
          ctx.fillStyle = '#94a3b8';
          ctx.fillText(node.sub, node.x, node.y + 4);
        }
      });

      // Teams in-person text tag
      ctx.font = '600 11px "JetBrains Mono", monospace';
      ctx.fillStyle = '#60a5fa';
      ctx.textAlign = 'right';
      ctx.fillText('Teams / in-person', N.orderEntry.x - 55, (N.orderEntry.y + N.csHold.y) / 2);

      // --- 3. Dynamic Moving Packets ---
      for (let i = packets.length - 1; i >= 0; i--) {
        const p = packets[i];
        p.progress += p.speed;

        let px, py, color;

        if (p.type === 'order') {
          // Linear main progression
          color = '#38bdf8';
          px = N.wcQueue.x + (N.production.x - N.wcQueue.x) * p.progress;
          py = N.wcQueue.y;
        } else if (p.type === 'cs') {
          // OE -> CS Hold -> OE loop
          color = '#fbbf24';
          const p0 = N.orderEntry, p3 = N.csHold;
          const cp1 = { x: N.orderEntry.x - 45, y: (N.orderEntry.y + N.csHold.y) / 2 };
          const cp2 = { x: N.csHold.x - 45, y: (N.orderEntry.y + N.csHold.y) / 2 };

          if (p.progress <= 0.5) {
            const pt = getBezierPoint(p.progress * 2, p0, cp1, cp2, p3);
            px = pt.x; py = pt.y;
          } else {
            color = '#ef4444';
            const pt = getBezierPoint((p.progress - 0.5) * 2, p3, cp2, cp1, p0);
            px = pt.x; py = pt.y;
          }
        } else if (p.type === 'reentry') {
          // Namelist -> Order Entry Top Arc
          color = '#eab308';
          const p0 = N.namelist, p3 = N.orderEntry;
          const cp1 = { x: (N.namelist.x + N.orderEntry.x) / 2, y: N.orderEntry.y - 80 };
          const pt = getBezierPoint(p.progress, p0, cp1, cp1, p3);
          px = pt.x; py = pt.y;
        } else {
          // Oracle internal cluster stall
          color = '#f87171';
          const angle = tick * 2 + i;
          px = N.orderEntry.x + Math.cos(angle) * (18 + (i % 8));
          py = N.orderEntry.y + Math.sin(angle) * (18 + (i % 8));
        }

        // Draw High-Contrast Glowing Packet
        ctx.fillStyle = color;
        ctx.shadowColor = color;
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(px, py, 4.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0; // reset

        if (p.progress >= 1) {
          packets.splice(i, 1);
        }
      }

      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
